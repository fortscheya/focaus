[package]
name = "focaus-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "focaus_desktop"
path = "src/lib.rs"

[dependencies]
focaus-contracts.workspace = true
focaus-ai = { path = "../../../crates/focaus-ai" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

rusqlite = { version = "=0.32.1", features = ["bundled"] }
cpal = "=0.16.0"
sha2.workspace = true
unicode-normalization = "=0.1.22"
tauri = { version = "2", optional = true, features = ["tray-icon"] }
uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[features]
default = []
native-shell = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:uuid",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "focaus"
path = "src/main.rs"
required-features = ["native-shell"]

[[test]]
name = "wire_contracts"
path = "../../../tests/integration/wire_contracts.rs"

[[test]]
name = "native_flow"
path = "../../../tests/integration/native_flow.rs"
