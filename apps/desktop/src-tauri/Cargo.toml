[package]
name = "focaus-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "focaus_desktop"
path = "src/lib.rs"

[dependencies]
focaus-contracts.workspace = true
focaus-ai = { path = "../../../crates/focaus-ai" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

rusqlite = { version = "=0.32.1", features = ["bundled"] }
cpal = "=0.16.0"
sha2.workspace = true
unicode-normalization = "=0.1.22"
tauri = { version = "2", optional = true, features = ["tray-icon"] }
uuid = { version = "1", features = ["v4"], optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[features]
default = []
native-shell = ["dep:tauri", "dep:tauri-build", "dep:uuid"]

[[bin]]
name = "focaus"
path = "src/main.rs"
required-features = ["native-shell"]

[[test]]
name = "wire_contracts"
path = "../../../tests/integration/wire_contracts.rs"
