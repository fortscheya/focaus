[workspace]
members = ["crates/focaus-contracts", "crates/focaus-ai", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }
sha2 = "0.10"
serde_json_canonicalizer = "0.3"
focaus-contracts = { path = "crates/focaus-contracts" }
